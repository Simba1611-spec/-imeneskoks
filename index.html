<!doctype html><html lang="lv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mūsu dzimtas koks</title><link rel="stylesheet" href="style.css"></head><body>
<header><div class="brand">🌿 <span>Mūsu dzimtas koks</span><small>Ģimenes vēsture • cilvēki • stāsti</small></div><div class="actions"><input id="search" placeholder="🔎 Meklēt…"><button id="minus">−</button><button id="reset">100%</button><button id="plus">＋</button><button id="edit" class="primary">✎ Rediģēt</button></div></header>
<main><aside id="panel" class="hidden"><div class="ph"><div><b>PERSONAS PROFILS</b><h2 id="title">Pievienot personu</h2></div><button id="close">×</button></div><form id="form"><input type="hidden" id="pid"><label>Fotogrāfija<div id="drop" class="drop">📷<small>Noklikšķini, lai pievienotu foto</small><input id="photo" type="file" accept="image/*"></div></label><div class="two"><label>Vārds<input id="first" required></label><label>Uzvārds<input id="last"></label></div><div class="two"><label>Dzimis<input id="birth"></label><label>Miris<input id="death"></label></div><label>Dzimums<select id="gender"><option value="">—</option><option value="M">Vīrietis</option><option value="F">Sieviete</option></select></label><label>Vecāki<select id="parents" multiple size="4"></select></label><label>Laulātais<select id="partner"><option value="">— nav norādīts —</option></select></label><label>Vieta<input id="place"></label><label>Stāsts<textarea id="bio"></textarea></label><button type="button" id="cancel">Atcelt</button> <button class="primary">Saglabāt</button></form></aside>
<section id="canvas"><div id="hint">Velc koku ar peli • + / − maina mērogu</div><div id="vp"><div id="tree"></div></div><div class="legend"><b>Kā lasīt koku</b><br><span class="heart">♥</span> pāris / laulātie<br><span class="line"></span> vecāki → bērni<br><span class="male"></span> vīrietis &nbsp; <span class="female"></span> sieviete</div></section></main>
<dialog id="dlg"><button id="xd">×</button><div id="details"></div></dialog><div id="toast"></div><script src="data.js"></script><script src="app.js"></script></body></html>
