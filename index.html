<!doctype html>
<html lang="lv">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dzimtas koks</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <h1 id="siteTitle">Mūsu dzimtas koks</h1>
      <p id="siteSubtitle">Interaktīvs dzimtas koks</p>
    </div>
    <div class="controls">
      <input id="search" type="search" placeholder="Meklēt personu..." aria-label="Meklēt personu">
      <button id="zoomOut" type="button">−</button>
      <button id="zoomReset" type="button">100%</button>
      <button id="zoomIn" type="button">+</button>
    </div>
  </header>

  <main>
    <section class="tree-wrap" aria-label="Interaktīvs dzimtas koks">
      <div id="tree" class="tree"></div>
    </section>
    <p class="hint">Velciet koku ar peli vai pirkstu. Izmantojiet + / −, lai mainītu mērogu. Noklikšķiniet uz personas, lai skatītu informāciju.</p>
  </main>

  <dialog id="personDialog">
    <button class="close" id="closeDialog" aria-label="Aizvērt">×</button>
    <div id="personDetails"></div>
  </dialog>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
